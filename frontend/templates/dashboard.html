<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivacity Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>


    <div class="card row">
        <span class="brand">VIVACITY</span>
        <div class="row">
            <span id="username"></span>
            <button id="logout-btn" class="btn-small">Log out</button>
        </div>
    </div>


    <div class="card row">
        <div>
            <h2>Welcome back, <span id="welcome-name"></span></h2>
            <div id="today-date" class="row-sub"></div>
        </div>
        <button id="start-session-btn" class="btn-primary">+ Start session</button>
    </div>


    <div id="session-panel" class="card hidden">
        <div class="row">
            <h3 id="session-panel-title">New session</h3>
            <button id="finish-session-btn" class="btn-small">Finish session</button>
        </div>
        <ul id="session-exercises"></ul>
        <button id="add-exercise-btn" class="btn-dashed">+ Add exercise</button>
    </div>

    <div class="grid">

        <div class="card">
            <h3>Session log</h3>
            <ul id="session-list"></ul>
            <div class="row-sub">Newest first. Tap a session to see its sets.</div>
        </div>


        <div class="card">
            <div class="row">
                <h3>Food log</h3>
                <div class="row">
                    <button id="food-prev" class="btn-small">&lsaquo;</button>
                    <span id="food-date"></span>
                    <button id="food-next" class="btn-small">&rsaquo;</button>
                </div>
            </div>
            <div class="row total-row">
                <span>Total calories</span>
                <span id="food-total-calories">0</span>
            </div>
            <div id="food-macros" class="row-sub"></div>
            <ul id="food-list"></ul>
            <button id="add-food-btn" class="btn-dashed">+ Add food</button>
        </div>
    </div>


    <div id="food-modal" class="modal hidden">
        <div class="modal-box">
            <h3>Add food</h3>
            <input id="food-search" type="text" placeholder="Search foods (e.g. chicken breast)">
            <ul id="food-results"></ul>
            <label for="food-servings">Servings (100g each)</label>
            <input id="food-servings" type="number" min="0" step="0.25" value="1">
            <div id="food-error" class="error"></div>
            <div class="row">
                <button id="food-cancel">Cancel</button>
                <button id="food-save" class="btn-primary">Add</button>
            </div>
        </div>
    </div>

    <div id="exercise-modal" class="modal hidden">
        <div class="modal-box">
            <h3>Add exercise</h3>
            <input id="exercise-search" type="text" placeholder="Search exercises (e.g. bench)">
            <ul id="exercise-results"></ul>
            <input id="exercise-sets" type="number" min="1" step="1" placeholder="Sets">
            <input id="exercise-reps" type="number" min="1" step="1" placeholder="Reps">
            <input id="exercise-weight" type="number" min="0" step="0.5" placeholder="Weight (lb)">
            <div id="exercise-error" class="error"></div>
            <div class="row">
                <button id="exercise-cancel">Cancel</button>
                <button id="exercise-save" class="btn-primary">Add</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
